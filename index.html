<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Перекуп</title>
<meta name="theme-color" content="#0c0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Перекуп">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app — sticky top bar, scrolling list of car "tickets", fixed bottom tab bar. */
:root{
  --bg:#0c0d0f; --surface:#141518; --sunk:#1b1d21; --line:#222429;
  --ink:#ededee; --muted:#80848c; --accent:#ededee; --accent-ink:#0c0d0f;
  --plate:#ededee; --plate-ink:#0c0d0f;
  --good:#5cc98f; --good-bg:rgba(92,201,143,.1); --bad:#ec7b70; --bad-bg:rgba(236,123,112,.1); --warn:#d9b45e; --warn-bg:rgba(217,180,94,.1);
  --display:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
[hidden]{display:none!important}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(12,13,15,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;min-height:58px}
.topbar h1{font:600 18px/1.1 var(--display);margin:0;flex:1;min-width:0;letter-spacing:-.01em;text-wrap:balance}
.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:active{background:var(--sunk)}
.iconbtn svg{width:22px;height:22px}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-block:16px;display:flex;flex-direction:column;gap:14px}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(12,13,15,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .row{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:500}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--ink)}
.fab{position:fixed;z-index:26;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(76px + env(safe-area-inset-bottom,0px));
  width:54px;height:54px;border-radius:50%;border:0;background:var(--plate);color:var(--plate-ink);display:grid;place-items:center}
.fab svg{width:24px;height:24px}

/* Summary strip */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary div{padding:4px 0;min-width:0}
.summary .k{font-size:12px;color:var(--muted)}
.summary .v{font-family:var(--mono);font-weight:500;font-size:17px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Segmented */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink)}
.seg .c{font-family:var(--mono);font-size:12px;opacity:.7;margin-left:4px}

/* Car ticket */
.car{display:grid;grid-template-columns:88px 1fr;gap:14px;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 0;text-align:left;width:100%;color:inherit}
.car:active{transform:scale(.99)}
.thumb{width:88px;height:88px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-size:40px;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.car .body{min-width:0;display:flex;flex-direction:column;gap:4px}
.car .t{font-weight:500;font-size:15px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.car .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car .foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto}
.price{font-family:var(--mono);font-weight:500;font-size:15px}
.chip{font-size:11px;font-weight:500;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.in_stock{background:var(--good-bg);color:var(--good)}
.chip.reserved{background:var(--warn-bg);color:var(--warn)}
.chip.sold{background:var(--sunk);color:var(--muted)}
.chip.pub{background:transparent;border:1px solid var(--line)}
.profit{font-family:var(--mono);font-size:12.5px;font-weight:500;margin-left:auto}
.pos{color:var(--good)} .neg{color:var(--bad)}
.who{font-size:12.5px;color:var(--muted);font-weight:500}

.empty{text-align:center;padding:40px 16px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font:600 16px/1.3 var(--display)}

/* Buttons & forms */
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink);min-height:48px}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.small{min-height:36px;padding:8px 14px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.55}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{width:100%;border:1px solid transparent;background:var(--sunk);border-radius:10px;padding:11px 12px;font-size:16px;min-height:46px}
.field textarea{min-height:90px;resize:vertical}
.field input.num{font-family:var(--mono)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sect{background:var(--surface);border:0;border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.sect h2{margin:0;font:500 13px/1.2 var(--display);color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.sect .hint{font-size:12.5px;color:var(--muted);margin:-6px 0 0}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:500}

.thumb svg{width:40px;height:40px;color:#3a3d44}
.hero-ph svg{width:96px;height:96px;color:#3a3d44}

.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.photos .ph{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;background:var(--sunk);max-width:100%}
.photos .ph img{width:100%;height:100%;object-fit:cover}
.photos .ph button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.photos .ph .first{position:absolute;left:3px;bottom:3px;font-size:10px;background:var(--plate);color:var(--plate-ink);padding:1px 5px;border-radius:5px;font-weight:600}
.photos label.add{aspect-ratio:1;border-radius:10px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;cursor:pointer}

.toggle{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.toggle button{border:0;border-radius:9px;padding:10px;background:transparent;font-weight:500;color:var(--muted);font-size:14px}
.toggle button[aria-pressed="true"]{background:#2a2d33;color:var(--ink)}
.toggle.three{grid-template-columns:repeat(3,1fr)}

/* Ledger */
.ledger{display:flex;flex-direction:column}
.ledger .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0}
.ledger .r:last-child{border-bottom:0}
.ledger .r span:first-child{color:var(--muted);font-size:14px}
.ledger .r .num{font-weight:500}
.ledger .r.total{border-bottom:0;border-top:1px solid var(--line);margin-top:4px;padding-top:10px}
.ledger .r.total span:first-child{color:var(--ink);font-weight:500}
.ledger .r.total .num{font-size:20px}
.exp{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.exp .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.exp .d{font-size:12px;color:var(--muted)}
.exp button{border:0;background:none;color:var(--muted);width:30px;height:30px;font-size:18px}
.expadd{display:flex;flex-direction:column;gap:8px;background:var(--sunk);border-radius:12px;padding:10px}
.expadd .rowi{display:grid;grid-template-columns:1fr 120px;gap:6px}
.expadd .rowb{display:grid;grid-template-columns:1fr auto;gap:6px}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:0;border-radius:999px;padding:6px 11px;font-size:13px;background:transparent;color:var(--muted)}
.cats button[aria-pressed="true"]{background:#2a2d33;color:var(--ink)}
.rep-total{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rep-total .num{font-size:24px;font-weight:500}
.rep-break{display:flex;flex-wrap:wrap;gap:6px}
.rep-break span{font-size:12px;color:var(--muted);background:var(--sunk);border-radius:999px;padding:3px 9px}
.rep-break b{color:var(--ink);font-family:var(--mono);font-weight:500;margin-left:4px}
.exp .cat{font-size:11px;color:var(--muted);margin-right:6px}
.expadd input{border:0;background:var(--surface);border-radius:10px;padding:9px 10px;min-height:42px;font-size:16px;min-width:0;width:100%}

/* Detail */
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:var(--r);scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery img{flex:none;width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:start;border-radius:var(--r);background:var(--sunk)}
.hero-ph{aspect-ratio:16/9;max-width:100%;border-radius:var(--r);background:var(--sunk);display:grid;place-items:center}
.dtitle{display:flex;flex-direction:column;gap:6px}
.dtitle h2{margin:0;font:600 22px/1.25 var(--display);letter-spacing:-.01em;text-wrap:balance}
.dtitle .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dtitle .big{font-family:var(--mono);font-weight:500;font-size:26px}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden}
.specs div{background:var(--surface);padding:9px 12px;min-width:0}
.specs>div:last-child:nth-child(odd){grid-column:1/-1}
.specs .k{font-size:12px;color:var(--muted)}
.specs .v{font-weight:500;overflow-wrap:anywhere}
.vin{font-family:var(--mono);font-size:13px;letter-spacing:.06em}
.desc{white-space:pre-wrap;overflow-wrap:anywhere}

/* People */
.person{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:10px 0}
.ava{width:44px;height:44px;border-radius:50%;background:var(--sunk);color:var(--ink);display:grid;place-items:center;font:500 17px var(--display);flex:none}
.person .m{flex:1;min-width:0}
.person .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .m span{font-size:12.5px;color:var(--muted)}
.search{position:relative}
.search input{width:100%;border:0;background:var(--sunk);border-radius:12px;padding:12px 14px 12px 40px;font-size:16px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.ph-head{display:flex;gap:14px;align-items:center}
.ph-head .ava{width:64px;height:64px;font-size:24px;border-radius:50%}
.ph-head h2{margin:0;font:600 20px/1.2 var(--display)}
.ph-head .u{color:var(--muted);font-size:13px}
.stats{display:flex;gap:18px;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-family:var(--mono)}

/* Auth */
.auth{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding-block:32px}
.brand{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.plate{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;background:transparent;color:var(--ink);border:1.5px solid var(--ink);border-radius:6px;padding:6px 10px;font:500 18px/1 var(--mono);letter-spacing:.08em}
.plate small{font-size:10px;border-left:1px solid var(--muted);color:var(--muted);padding-left:8px;line-height:1.1;letter-spacing:0}
.brand h1{font:600 32px/1.1 var(--display);margin:0;letter-spacing:-.02em}
.brand p{margin:0;color:var(--muted);max-width:34ch}
.form{display:flex;flex-direction:column;gap:12px}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px}
.link{border:0;background:none;color:var(--muted);font-weight:500;padding:8px}

/* Sheet & toast */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .topbar{top:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;background:#2a2d33;color:var(--ink);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-bg);border-radius:12px;padding:10px 12px}
.confirm span{flex:1;min-width:140px;color:var(--bad);font-size:14px}
.loading{padding:40px;text-align:center;color:var(--muted)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.row-actions .btn{flex:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div id="toast" class="toast" hidden></div>

<script src="https://telegram.org/js/telegram-web-app.js?59"></script>

<script>
const SB_URL = "https://qzhybltmqctwygnmnrgh.supabase.co";
const SB_KEY = "sb_publishable_v3uRAnFgXzTEZMOD_TRVPg_N1dMced3";
// Session storage: memory first, localStorage as a bonus (Telegram's iOS webview may drop it).
const MEM = {};
const authStorage = {
  getItem: k => { if (k in MEM) return MEM[k]; try { return localStorage.getItem(k); } catch { return null; } },
  setItem: (k, v) => { MEM[k] = v; try { localStorage.setItem(k, v); } catch {} },
  removeItem: k => { delete MEM[k]; try { localStorage.removeItem(k); } catch {} },
};
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { storage: authStorage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
const BOT_USERNAME = "perecoupbot";            // username бота без @, заполняется после создания бота
const TG = window.Telegram?.WebApp;
const IN_TG = !!(TG && TG.initData);

const STATUS = {in_stock:"В наличии", reserved:"Бронь", sold:"Продана"};
const CATS = {repair:"Ремонт", parts:"Запчасти", body:"Кузов/покраска", tires:"Шины/диски", docs:"Оформление", transport:"Перегон", other:"Другое"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = v => (v === null || v === undefined || v === "" || isNaN(v)) ? "—" : Math.round(Number(v)).toLocaleString("ru-RU").replace(/,/g," ") + " ₽";
const short = v => { const a=Math.abs(v), sg = v<0?"−":""; if (a>=1e6) return sg+(a/1e6).toLocaleString("ru-RU",{maximumFractionDigits:2})+" млн ₽"; if (a>=1e3) return sg+Math.round(a/1e3)+" тыс ₽"; return sg+Math.round(a)+" ₽"; };
const sshort = v => (v>0?"+":"") + short(v);
const signed = v => (v > 0 ? "+" : v < 0 ? "−" : "") + money(Math.abs(v));
const numOrNull = v => { const s = String(v ?? "").replace(/\s/g,"").replace(",","."); if (s === "") return null; const n = Number(s); return isNaN(n) ? null : n; };
const one = x => Array.isArray(x) ? (x[0] || null) : (x || null);
const initial = p => (p?.display_name || p?.username || "?").trim().charAt(0).toUpperCase();

const I = {
  garage:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l9-5 9 5v12"/><path d="M7 21v-6h10v6"/><path d="M7 18h10"/></svg>',
  feed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="14" width="16" height="6" rx="2"/></svg>',

  me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l4-5 3 3 5-6"/></svg>',

  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>',
  car:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15v-2.5l2-4.5c.3-.6.9-1 1.6-1h10.8c.7 0 1.3.4 1.6 1l2 4.5V15"/><path d="M3 15h18v2.5H3z"/><circle cx="7" cy="17.5" r="1.5"/><circle cx="17" cy="17.5" r="1.5"/><path d="M5 12.5h14"/></svg>',
  lock:'<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
};

const S = { user:null, me:null, tab:"garage", filter:"in_stock", feedMode:"follow", cars:[], following:new Set() };

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(t._h); t._h=setTimeout(()=>t.hidden=true,2400); }
function fail(e){ console.error(e); toast(e?.message ? "Ошибка: " + e.message : "Что-то пошло не так, попробуй ещё раз"); }

// ---------- money math ----------
function calc(car){
  const f = one(car.car_finance) || {};
  const exps = car.car_expenses || [];
  const expSum = exps.reduce((a,e)=>a + Number(e.amount||0), 0);
  const buy = f.purchase_price != null ? Number(f.purchase_price) : null;
  const invested = (buy ?? 0) + expSum;
  const list = car.list_price != null ? Number(car.list_price) : null;
  const sale = f.sale_price != null ? Number(f.sale_price) : null;
  const margin = list != null && buy != null ? list - invested : null;          // ожидаемая
  const profit = sale != null && buy != null ? sale - invested : null;         // фактическая
  const roi = profit != null && invested > 0 ? profit / invested * 100 : null;
  const days = f.purchased_at ? Math.max(0, Math.round(((f.sold_at ? new Date(f.sold_at) : new Date()) - new Date(f.purchased_at)) / 864e5)) : null;
  return { f, exps, expSum, buy, invested, list, sale, margin, profit, roi, days };
}

// Telegram: exchange signed initData for a Supabase session.
let tgLoginP = null;
function tgLogin(){
  if (tgLoginP) return tgLoginP;
  tgLoginP = (async () => {
    const r = await fetch(SB_URL + "/functions/v1/tg-auth", { method:"POST", headers:{ "Content-Type":"application/json", apikey:SB_KEY, Authorization:"Bearer " + SB_KEY }, body: JSON.stringify({ initData: TG.initData }) });
    const j = await r.json();
    if (!r.ok || !j.token_hash) throw new Error(j.error || "auth_failed");
    let v = await sb.auth.verifyOtp({ token_hash: j.token_hash, type: "magiclink" });
    if (v.error) v = await sb.auth.verifyOtp({ token_hash: j.token_hash, type: "email" });
    if (v.error) throw v.error;
    S.user = v.data.user;
    return v.data.session;
  })().finally(() => { tgLoginP = null; });
  return tgLoginP;
}
// Call before any write: guarantees a live session for this user.
async function ensureSession(){
  const { data:{ session } } = await sb.auth.getSession();
  if (session && session.user?.id === S.user?.id && session.expires_at * 1000 > Date.now() + 30000) return true;
  if (session) { const { data, error } = await sb.auth.refreshSession(); if (!error && data.session) return true; }
  if (IN_TG) { await tgLogin(); return true; }
  toast("Сессия истекла, войди снова"); renderAuth(); return false;
}

async function bootTelegram(){
  try { TG.ready(); TG.expand(); TG.setHeaderColor("#0c0d0f"); TG.setBackgroundColor("#0c0d0f"); TG.setBottomBarColor?.("#0c0d0f"); TG.disableVerticalSwipes?.(); } catch {}
  TG.BackButton.onClick(closeSheet);
  const tgId = TG.initDataUnsafe?.user?.id;
  $("#app").innerHTML = `<div class="loading">Входим через Telegram…</div>`;
  try {
    const { data:{ session } } = await sb.auth.getSession();
    if (session) {
      S.user = session.user; await loadMe();
      if (S.me && Number(S.me.telegram_id) === Number(tgId)) { renderShell(); return openFromHash(); }
      silentSignOut = true; await sb.auth.signOut(); silentSignOut = false;
    }
    await tgLogin(); await loadMe();
    renderShell(); openFromHash();
  } catch (e) {
    console.error(e);
    $("#app").innerHTML = `<div class="wrap auth"><div class="brand"><h1>Не получилось войти</h1><p>Закрой приложение и открой его снова из бота. Если не помогло, напиши разработчику: ${esc(e.message||e)}</p></div></div>`;
  }
}

async function loadMyCars(){

function carCard(car, opts={}){
  const ph = car.photos?.[0];
  const c = opts.own ? calc(car) : null;
  const repSum = opts.own ? (car.car_expenses||[]).reduce((a,e)=>a+Number(e.amount||0),0) : 0;
  const spec = [car.year, car.mileage != null ? Number(car.mileage).toLocaleString("ru-RU") + " км" : null, car.engine].filter(Boolean).join(" · ");
  let right = "";
  if (c) {
    if (car.status === "sold" && c.profit != null) right = `<span class="profit ${c.profit>=0?"pos":"neg"}">${signed(c.profit)}</span>`;
    else if (c.margin != null) right = `<span class="profit ${c.margin>=0?"pos":"neg"}" title="Ожидаемая маржа">~${signed(c.margin)}</span>`;
  }
  return `<button class="car" data-id="${car.id}">
    <div class="thumb">${ph ? `<img src="${esc(ph)}" alt="" loading="lazy">` : I.car}</div>
    <div class="body">
      ${opts.who ? `<span class="who">@${esc(car.profiles?.username)}</span>` : ""}
      <span class="t">${esc(car.make)} ${esc(car.model)}</span>
      <span class="s">${esc(spec) || "&nbsp;"}</span>${repSum ? `<span class="s">Ремонт и вложения: <span class="num">${short(repSum)}</span></span>` : ""}
      <div class="foot">
        <span class="price">${car.status==="sold" && c?.sale!=null ? money(c.sale) : money(car.list_price)}</span>
        ${opts.own ? `<span class="chip ${car.status}">${STATUS[car.status]}</span>${car.visibility==="public"?'<span class="chip pub">Публично</span>':""}` : (car.status!=="in_stock" ? `<span class="chip ${car.status}">${STATUS[car.status]}</span>` : "")}
        ${right}
      </div>
    </div>
  </button>`;
}

async function toggleFollow(id){

    if (error) return toast(/duplicate|unique/i.test(error.message) ? "Этот ник уже занят" : "Не сохранилось: " + error.message);
    await loadMe(); closeSheet(); toast("Профиль сохранён"); renderTab();

function openSheet(html){ if (IN_TG) TG.BackButton.show(); const s=$("#sheet"); s.innerHTML=html; s.hidden=false; s.scrollTop=0; document.body.style.overflow="hidden"; s.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet); }
function closeSheet(){ if (IN_TG) TG.BackButton.hide(); const s=$("#sheet"); const wasOpen = !s.hidden; s.hidden=true; s.innerHTML=""; document.body.style.overflow=""; if (wasOpen && S.user && $("#view")) renderTab(); }

// ---------- Repairs block (shared by card and editor) ----------
function mountRepairs(root, exps, { onAdd, onDel }){
  let cat = "repair";
  const draw = () => {
    const list = [...exps].sort((a,b)=>(a.spent_at||"").localeCompare(b.spent_at||""));
    const total = exps.reduce((a,e)=>a+Number(e.amount||0),0);
    const by = {}; exps.forEach(e => by[e.category||"repair"] = (by[e.category||"repair"]||0) + Number(e.amount||0));
    root.innerHTML = `
      <div class="rep-total"><span style="color:var(--muted)">Вложено в машину</span><span class="num">${money(total)}</span></div>
      ${Object.keys(by).length > 1 ? `<div class="rep-break">${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span>${CATS[k]||k}<b>${short(v)}</b></span>`).join("")}</div>` : ""}
      <div>${list.map(e=>`<div class="exp"><div class="n">${esc(e.title)}<div class="d">${CATS[e.category]||"Ремонт"}${e.spent_at?" · "+new Date(e.spent_at).toLocaleDateString("ru-RU"):""}</div></div><span class="num">${money(e.amount)}</span><button type="button" data-del="${exps.indexOf(e)}" aria-label="Удалить">×</button></div>`).join("")}</div>
      <div class="expadd">
        <div class="cats">${Object.entries(CATS).map(([k,l])=>`<button type="button" data-cat="${k}" aria-pressed="${k===cat}">${l}</button>`).join("")}</div>
        <div class="rowi"><input class="r_title" placeholder="Что сделано: замена ГРМ, полировка…" aria-label="Что сделано"><input class="r_amt num" inputmode="decimal" placeholder="Сумма ₽" aria-label="Сумма"></div>
        <div class="rowb"><input class="r_date" type="date" value="${new Date().toISOString().slice(0,10)}" aria-label="Дата"><button type="button" class="btn small r_add">Добавить</button></div>
      </div>`;
    root.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { cat = b.dataset.cat; root.querySelectorAll("[data-cat]").forEach(x=>x.setAttribute("aria-pressed", x===b)); });
    root.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { const e = exps[+b.dataset.del]; if (await onDel(e) !== false) { exps.splice(exps.indexOf(e),1); draw(); } });
    root.querySelectorAll(".expadd input").forEach(i => i.onkeydown = ev => { if (ev.key === "Enter") { ev.preventDefault(); root.querySelector(".r_add").click(); } });
    root.querySelector(".r_add").onclick = async () => {
      const title = root.querySelector(".r_title").value.trim() || CATS[cat];
      const amount = numOrNull(root.querySelector(".r_amt").value);
      if (amount == null) { toast("Укажи сумму числом"); root.querySelector(".r_amt").focus(); return; }
      const e = { category:cat, title, amount, spent_at: root.querySelector(".r_date").value || null };
      if (!await ensureSession()) return;
      const saved = await onAdd(e);
      if (saved === false) return;
      exps.push(saved || e); draw(); toast("Добавлено: " + money(amount));
    };
  };
  draw();
}

      onDel: async e => { const { error } = await sb.from("car_expenses").delete().eq("id", e.id); if (error) { fail(error); return false; } car.car_expenses = (car.car_expenses||[]).filter(x=>x.id!==e.id); setTimeout(refreshLedger); },

  }

// ---------- Editor ----------
async function compress(file){
  try {
    const bmp = await createImageBitmap(file);
    const max = 1600, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width*k); cv.height = Math.round(bmp.height*k);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    return await new Promise(r => cv.toBlob(b => r(b || file), "image/jpeg", 0.82));
  } catch { return file; }
}

    </section>

      <div class="toggle three" id="stSel">${Object.entries(STATUS).map(([k,l])=>`<button type="button" data-st="${k}" aria-pressed="${st.status===k}">${l}</button>`).join("")}</div>

      photos: st.photos, status: st.status, visibility: st.visibility,
      make: $("#c_make").value.trim(), model: $("#c_model").value.trim(),

      purchase_price: numOrNull($("#f_buy").value), purchased_at: $("#f_bd").value||null,
      sale_price: numOrNull($("#f_sale").value), sold_at: $("#f_sd").value||null,
      private_notes: $("#f_notes").value.trim()||null,
    };
    if (fin.sale_price != null && row.status !== "sold") row.status = "sold";
    if (row.status === "sold" && fin.sale_price != null && !fin.sold_at) fin.sold_at = new Date().toISOString().slice(0,10);
    try {
      let id = car?.id;
      if (isNew) {
        const { data, error } = await sb.from("cars").insert({ ...row, owner_id:S.user.id }).select("id").single();
        if (error) throw error; id = data.id;
      } else {
        const { error } = await sb.from("cars").update(row).eq("id", id); if (error) throw error;
      }
      const { error:fe } = await sb.from("car_finance").upsert({ car_id:id, owner_id:S.user.id, ...fin });
      if (fe) throw fe;
      if (isNew && pendingExps.length) { const { error:ee } = await sb.from("car_expenses").insert(pendingExps.map(e=>({ ...e, car_id:id, owner_id:S.user.id }))); if (ee) throw ee; }
      toast(isNew ? "Машина добавлена" : "Сохранено");
      if (isNew) { S.filter = row.status; }
      await loadMyCars();
      if (S.tab === "garage") viewGarage();
      openCar(id);
    } catch(ex){ btn.disabled = false; fail(ex); }
  };
}

boot();
</script>
</body>
</html>
